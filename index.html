<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pick a Number 1-10</title>
    <style>
      :root {
        --bg: #efefef;
        --ink: #000000;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        font-family: Impact, Haettenschweiler, "Arial Black", sans-serif;
        color: var(--ink);
      }

      .game {
        position: relative;
        width: min(100vw, 1500px);
        min-height: 100vh;
        padding: 2rem 2.5rem 3rem;
        display: grid;
        grid-template-columns: 1.1fr 1.5fr;
        align-items: center;
      }

      .left-panel {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 1.2rem;
        padding-left: 1rem;
      }

      .title {
        font-size: clamp(2.2rem, 3vw, 4.2rem);
        line-height: 0.9;
        margin: 0;
      }

      .status {
        font-size: clamp(2.7rem, 4vw, 5.2rem);
        line-height: 0.9;
        margin: 0;
        min-height: 1.2em;
      }

      .status.hidden {
        opacity: 0.25;
      }

      .guess-area {
        margin-top: 1rem;
        display: flex;
        align-items: center;
        gap: 0.85rem;
      }

      .guess-area input {
        width: 180px;
        height: 56px;
        border: 3px solid #000;
        border-radius: 16px;
        font-size: 2rem;
        text-align: center;
        background: #f7f7f7;
        font-family: Arial, Helvetica, sans-serif;
        font-weight: 700;
      }

      .guess-area button,
      .choice-btn {
        border: 3px solid #000;
        border-radius: 14px;
        background: #f3f3f3;
        color: #000;
        font-weight: 900;
        cursor: pointer;
        font-family: Impact, Haettenschweiler, "Arial Black", sans-serif;
      }

      .guess-area button {
        height: 56px;
        padding: 0 1.2rem;
        font-size: 1.6rem;
      }

      .play-again {
        margin-top: 1.2rem;
        font-size: clamp(2.2rem, 3vw, 4rem);
        line-height: 0.9;
      }

      .answer-row {
        display: flex;
        align-items: center;
        gap: 1rem;
        flex-wrap: wrap;
        margin-top: 0.4rem;
      }

      .choice-btn {
        min-width: 120px;
        padding: 0.3rem 1.2rem 0.5rem;
        font-size: clamp(1.6rem, 2vw, 2.4rem);
      }

      .avocado-wrap {
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
      }

      .avocado-container {
        position: relative;
        width: min(80vw, 750px);
        aspect-ratio: 1;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .avocado-container img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .eye {
        position: absolute;
        width: 50px;
        height: 50px;
        background: #2c1b0f;
        border-radius: 50%;
        box-shadow: inset 0 -4px 0 rgba(255,255,255,0.12);
      }

      .eye.left {
        top: 35%;
        left: 30%;
      }

      .eye.right {
        top: 35%;
        right: 30%;
      }

      .eye::after {
        content: "";
        position: absolute;
        top: 20%;
        left: 20%;
        width: 12px;
        height: 12px;
        background: rgba(255,255,255,0.95);
        border-radius: 50%;
      }

      .smile {
        position: absolute;
        bottom: 25%;
        left: 50%;
        width: 100px;
        height: 50px;
        transform: translateX(-50%);
        border-bottom: 6px solid #2c1b0f;
        border-radius: 0 0 100px 100px;
      }

      @media (max-width: 980px) {
        .game {
          grid-template-columns: 1fr;
          padding-top: 1.5rem;
        }

        .left-panel {
          order: 2;
          padding-left: 0;
          text-align: center;
          align-items: center;
        }

        .avocado-wrap {
          order: 1;
        }

        .guess-area {
          justify-content: center;
        }
      }
    </style>
  </head>
  <body>
    <main class="game">
      <section class="left-panel">
        <h1 class="title">pick a number 1-10</h1>

        <div id="winText" class="status">You win</div>
        <div id="loseText" class="status hidden">You lose</div>

        <div class="guess-area">
          <input id="guessInput" type="number" min="1" max="10" placeholder="?" />
          <button id="guessBtn" type="button">Go</button>
        </div>

        <div class="play-again">
          Do you want to
          <div class="answer-row">
            <button class="choice-btn" data-choice="yes">yes</button>
            <button class="choice-btn" data-choice="no">no</button>
          </div>
        </div>
      </section>

      <section class="avocado-wrap" aria-label="Avocado character">
        <div class="avocado-container">
          <img src="https://img.freepik.com/premium-photo/whole-half-fresh-green-avocado-isolated-white-background_1059083-497.jpg" alt="Fresh green avocado" />
          <div class="eye left"></div>
          <div class="eye right"></div>
          <div class="smile"></div>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
